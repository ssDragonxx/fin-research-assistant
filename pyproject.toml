[project]
name = "fin"
version = "0.1.0"
description = "A-share research CLI for Hermes skills"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
fin = "fin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
